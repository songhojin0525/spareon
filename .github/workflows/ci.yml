name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux (pnpm verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (Go required)
        run: pnpm verify
        env:
          REQUIRE_GO: '1'

  windows:
    name: windows (agent go test)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Go test
        run: go test ./...
      # S21 adds the installer build here.
